[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpenn"
version = "1.0.0"
description = "Neural networks with differentiable belief-function layers (MP-ENN, BELIEF 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antonin Sulc" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0,<2.6",
    "torchvision>=0.15,<0.21",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
nli = ["transformers>=4.30,<5.0", "datasets>=2.14"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["mpenn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
